<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home Sketches</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        padding: 24px 16px;
        background: #e9ebe8;
        font-family: 'Heebo', system-ui, sans-serif;
        color: #13231c;
      }
      .grid {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 32px;
      }
      figure {
        margin: 0;
      }
      figcaption {
        margin-block-end: 10px;
        font-weight: 700;
        font-size: 18px;
      }
      figcaption span {
        display: block;
        font-weight: 500;
        font-size: 14px;
        color: #5b6660;
      }
      iframe {
        width: 375px;
        height: 812px;
        border: 0;
        border-radius: 32px;
        background: #fff;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
      }
    </style>
  </head>
  <body>
    <div class="grid">
      <figure>
        <figcaption>אפשרות 1<span>רצועה ירוקה, ריבועי פעולה כהים, תפריט צף</span></figcaption>
        <iframe src="home-sketch-option-1.html" title="אפשרות 1"></iframe>
      </figure>
      <figure>
        <figcaption>אפשרות 2<span>קרם בהיר, כותרות סריף, תצוגת פריטים, כפתור + צהוב</span></figcaption>
        <iframe src="home-sketch-option-2.html" title="אפשרות 2"></iframe>
      </figure>
      <figure>
        <figcaption>אפשרות 3<span>כרטיס כהה עם ליים, מסלול בחנות לפי אזורים, + במרכז התפריט</span></figcaption>
        <iframe src="home-sketch-option-3.html" title="אפשרות 3"></iframe>
      </figure>
    </div>
  </body>
</html>

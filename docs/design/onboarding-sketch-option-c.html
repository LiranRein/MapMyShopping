<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Onboarding Option C</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
    <style>
      :root {
        --ink: #14201b; --ink-2: #26342e; --lime: #c6f36b; --lime-soft: #eefbd6;
        --bg: #f2f3ef; --white: #fff; --muted: #646e69; --subtle: #707a75; --border: #e2e5df;
        --error: #b42318; --warning: #8a5300;
      }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 32px 24px; background: #dfe2dc; color: var(--ink); font-family: 'Rubik', system-ui, sans-serif; }
      .page-title { margin: 0 0 6px; font-size: 26px; font-weight: 800; }
      .page-sub { margin: 0 0 28px; color: var(--muted); font-size: 15px; }
      .grid { display: flex; flex-wrap: wrap; gap: 28px; }
      figure { margin: 0; }
      figcaption { margin-top: 10px; font-size: 14px; font-weight: 700; color: var(--muted); text-align: center; }
      .phone { position: relative; width: 375px; height: 760px; overflow: hidden; border-radius: 40px; background: var(--bg); box-shadow: 0 20px 50px rgba(20, 32, 27, 0.18); }
      .screen { height: 100%; display: flex; flex-direction: column; padding: 28px 20px 24px; }
      svg { display: block; }
      .back { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; background: var(--white); }
      .eyebrow { font-size: 15px; font-weight: 600; color: var(--muted); }
      h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.3px; line-height: 1.15; }
      h2 { margin: 0; font-size: 21px; font-weight: 800; }
      p { margin: 0; }
      .lead { margin-top: 10px; font-size: 15px; font-weight: 600; color: var(--muted); line-height: 1.45; }
      .spacer { flex: 1; }
      .cta { display: flex; align-items: center; justify-content: space-between; width: 100%; height: 54px; padding-inline: 20px 8px; border: 0; border-radius: 18px; background: var(--lime); color: var(--ink); font: 800 17px 'Rubik', sans-serif; }
      .cta .arrow { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--ink); color: var(--lime); }
      .cta.ink { background: var(--ink); color: var(--white); }
      .cta.ink .arrow { background: var(--lime); color: var(--ink); }
      .cta.loading { opacity: 0.85; }
      .spin { width: 22px; height: 22px; border: 3px solid rgba(20, 32, 27, 0.25); border-top-color: var(--ink); border-radius: 50%; }
      .ghost { margin-top: 12px; text-align: center; font-size: 15px; font-weight: 700; color: var(--ink); opacity: 0.6; }
      .steps { display: flex; gap: 6px; margin-top: 18px; }
      .steps span { height: 6px; flex: 1; border-radius: 99px; background: var(--border); }
      .steps span.on { background: var(--ink); }
      .label { margin: 26px 0 8px; font-size: 15px; font-weight: 600; }
      .field { display: flex; align-items: center; height: 56px; padding-inline: 16px; border: 1px solid var(--border); border-radius: 18px; background: var(--white); font-size: 17px; font-weight: 700; }
      .field.focus { border: 2px solid var(--ink); }
      .field.err { border: 2px solid var(--error); }
      .field .ph { color: var(--subtle); font-weight: 500; }
      .helper { margin-top: 8px; font-size: 13px; color: var(--muted); }
      .error { display: flex; gap: 6px; align-items: center; margin-top: 8px; font-size: 13px; font-weight: 600; color: var(--error); }
      .code { direction: ltr; justify-content: center; letter-spacing: 3px; font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
      .welcome { background: var(--ink); color: var(--white); }
      .mark { position: relative; width: 120px; height: 120px; margin: 70px auto 0; }
      .mark span { position: absolute; inset: 0; display: grid; place-items: center; color: var(--lime); }
      .welcome h1 { margin-top: 40px; text-align: center; font-size: 34px; }
      .welcome .lead { text-align: center; color: rgba(255, 255, 255, 0.75); }
      .bullets { margin: 34px 0 0; padding: 0; list-style: none; display: grid; gap: 14px; }
      .bullets li { display: flex; gap: 12px; align-items: center; font-size: 15px; font-weight: 600; color: rgba(255, 255, 255, 0.9); }
      .bullets i, .bullets svg { color: var(--lime); }
      .choice { margin-top: 26px; display: grid; gap: 12px; }
      .card { padding: 20px; border-radius: 24px; background: var(--white); }
      .card.dark { background: var(--ink); color: var(--white); }
      .card .ic { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: var(--bg); color: var(--ink); }
      .card.dark .ic { background: var(--lime); }
      .card h3 { margin: 16px 0 4px; font-size: 19px; font-weight: 800; }
      .card p { font-size: 14px; color: var(--muted); line-height: 1.4; }
      .card.dark p { color: rgba(255, 255, 255, 0.72); }
      .card .row { display: flex; justify-content: space-between; align-items: flex-start; }
      .banner { display: flex; gap: 10px; align-items: flex-start; margin-top: 16px; padding: 14px 16px; border-radius: 18px; background: var(--white); font-size: 14px; line-height: 1.4; }
      .banner b { display: block; font-size: 15px; }
      .banner .warn { color: var(--warning); }
      .hh-head { display: flex; justify-content: space-between; align-items: center; }
      .members { margin-top: 12px; padding: 6px 16px; border-radius: 24px; background: var(--white); }
      .member { display: flex; align-items: center; gap: 12px; padding-block: 12px; }
      .member + .member { border-top: 1px solid var(--border); }
      .avatar { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--lime-soft); font-weight: 800; }
      .member .name { font-size: 17px; font-weight: 700; }
      .role { margin-inline-start: auto; padding: 4px 10px; border-radius: 99px; background: var(--bg); font-size: 12px; font-weight: 700; color: var(--muted); }
      .role.mgr { background: var(--ink); color: var(--lime); }
      .invite { margin-top: 22px; padding: 20px; border-radius: 28px; background: var(--ink); color: var(--white); }
      .invite .k { font-size: 14px; color: rgba(255, 255, 255, 0.7); }
      .invite .code-big { direction: ltr; margin: 10px 0 4px; font-size: 32px; font-weight: 800; letter-spacing: 4px; color: var(--lime); text-align: center; font-variant-numeric: tabular-nums; }
      .invite .exp { text-align: center; font-size: 13px; color: rgba(255, 255, 255, 0.75); }
      .invite .actions { display: flex; gap: 10px; margin-top: 16px; }
      .pill { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border: 0; border-radius: 18px; background: var(--lime); color: var(--ink); font: 800 15px 'Rubik', sans-serif; }
      .pill.sec { background: var(--ink-2); color: var(--white); }
      .nav { position: absolute; inset-inline: 16px; bottom: 16px; display: grid; grid-template-columns: 1fr 1fr 76px 1fr 1fr; align-items: center; height: 70px; border-radius: 24px; background: var(--white); box-shadow: 0 10px 30px rgba(20, 32, 27, 0.12); }
      .nav a { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; font-weight: 600; color: var(--muted); }
      .nav a.on { color: var(--ink); font-weight: 800; }
      .nav .add { display: grid; place-items: center; width: 60px; height: 60px; margin: -26px auto 0; border: 5px solid var(--bg); border-radius: 50%; background: var(--ink); color: var(--lime); }
    </style>
  </head>
  <body>
    <style>
      .member-card { position: relative; padding: 20px; border-radius: 28px; background: var(--ink); color: var(--white); overflow: hidden; }
      .member-card > div { position: relative; }
      .member-card .lbl { font-size: 13px; color: rgba(255, 255, 255, 0.65); }
      .member-card .val { margin-top: 2px; font-size: 22px; font-weight: 800; }
      .member-card .val.empty { color: rgba(255, 255, 255, 0.3); }
      .member-card .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 16px; }
      .member-card .top { display: flex; justify-content: space-between; align-items: center; }
      .member-card .chip { padding: 5px 10px; border-radius: 99px; background: var(--lime); color: var(--ink); font-size: 12px; font-weight: 800; }
      .member-card .chip.off { background: var(--ink-2); color: rgba(255, 255, 255, 0.6); }
      .member-card .deco { position: absolute; inset-block-end: -50px; inset-inline-end: -50px; width: 140px; height: 140px; border: 14px solid var(--ink-2); border-radius: 50%; }
      .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
      .tile2 { display: flex; flex-direction: column; gap: 16px; padding: 16px; border-radius: 20px; background: var(--white); font-size: 16px; font-weight: 800; }
      .tile2 small { font-size: 13px; font-weight: 500; color: var(--muted); }
      .tile2 .ic { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--bg); }
      .tile2.sel { outline: 2px solid var(--ink); }
      .tile2.sel .ic { background: var(--lime); }
      .ticket { position: relative; margin-top: 18px; border-radius: 24px; background: var(--white); }
      .ticket .tt { padding: 18px 20px 14px; }
      .ticket .cut { position: relative; border-top: 2px dashed var(--border); margin-inline: 14px; }
      .ticket .cut::before, .ticket .cut::after { content: ""; position: absolute; top: -12px; width: 22px; height: 22px; border-radius: 50%; background: var(--bg); }
      .ticket .cut::before { inset-inline-start: -26px; }
      .ticket .cut::after { inset-inline-end: -26px; }
      .ticket .tb { padding: 14px 20px 18px; text-align: center; }
      .ticket .c { direction: ltr; font-size: 30px; font-weight: 800; letter-spacing: 4px; }
      .ticket .e { font-size: 13px; color: var(--muted); }
      .toast { position: absolute; inset-inline: 20px; bottom: 102px; display: flex; gap: 10px; align-items: center; padding: 14px 16px; border-radius: 18px; background: var(--ink); color: var(--white); font-size: 14px; font-weight: 600; }
      .toast i, .toast svg { color: var(--lime); }
    </style>
    <h1 class="page-title">אפשרות C - כרטיס הבית שמתמלא</h1>
    <p class="page-sub">כרטיס דיו קבוע בראש כל צעד, שמתמלא תוך כדי (שם, בית, תפקיד) - ממשיך את כרטיס ה-hero של מסך הבית. רק שני צעדים: שם, ואז בית חדש או קוד באותו מסך. קוד ההזמנה מוצג ככרטיס כניסה.</p>
    <div class="grid">
      <figure>
        <div class="phone">
          <div class="screen">
            <div class="eyebrow">הרשימה של הבית</div>
            <h1 style="margin-top: 4px">בונים את כרטיס הבית שלכם</h1>
            <p class="lead">שני צעדים קצרים: שם, ואז בית חדש או הצטרפות לבית קיים. בלי אימייל ובלי סיסמה.</p>
            <div style="margin-top: 28px">
            <div class="member-card"><span class="deco"></span>
              <div class="top"><span class="lbl">כרטיס הבית</span><span class="chip off">עוד רגע</span></div>
              <div class="grid2"><div><div class="lbl">השם שלי</div><div class="val empty">___</div></div><div><div class="lbl">הבית</div><div class="val empty">___</div></div></div>
            </div></div>
            <div class="two">
              <div class="tile2"><span class="ic"><i data-lucide="users-round" width="20" height="20"></i></span>כולם מוסיפים<small>מכל טלפון בבית</small></div>
              <div class="tile2"><span class="ic"><i data-lucide="route" width="20" height="20"></i></span>אחד קונה<small>לפי סדר החנות</small></div>
            </div>
            <div class="spacer"></div>
            <button class="cta">בואו נתחיל<span class="arrow"><i data-lucide="arrow-left" width="20" height="20"></i></span></button>
          </div>
        </div>
        <figcaption>1. פתיחה</figcaption>
      </figure>
      <figure>
        <div class="phone">
          <div class="screen"><span class="back"><i data-lucide="chevron-right" width="21" height="21"></i></span>
            <div style="margin-top: 18px">
            <div class="member-card"><span class="deco"></span>
              <div class="top"><span class="lbl">כרטיס הבית</span><span class="chip off">שלב 1 מתוך 2</span></div>
              <div class="grid2"><div><div class="lbl">השם שלי</div><div class="val">נועה</div></div><div><div class="lbl">הבית</div><div class="val empty">___</div></div></div>
            </div></div>
            <h2 style="margin-top: 26px">איך קוראים לך?</h2>
            <div class="label" style="margin-top: 12px">שם תצוגה</div>
            <div class="field focus">נועה</div>
            <div class="helper">יופיע לבני הבית ליד מה שהוספת.</div>
            <div class="spacer"></div>
            <button class="cta">המשך<span class="arrow"><i data-lucide="arrow-left" width="20" height="20"></i></span></button>
          </div>
        </div>
        <figcaption>2. שם תצוגה (הכרטיס מתמלא)</figcaption>
      </figure>
      <figure>
        <div class="phone">
          <div class="screen"><span class="back"><i data-lucide="chevron-right" width="21" height="21"></i></span>
            <div style="margin-top: 18px">
            <div class="member-card"><span class="deco"></span>
              <div class="top"><span class="lbl">כרטיס הבית</span><span class="chip off">שלב 2 מתוך 2</span></div>
              <div class="grid2"><div><div class="lbl">השם שלי</div><div class="val">נועה</div></div><div><div class="lbl">הבית</div><div class="val empty">___</div></div></div>
            </div></div>
            <h2 style="margin-top: 26px">ולאיזה בית?</h2>
            <div class="two" style="margin-top: 12px">
              <div class="tile2 sel"><span class="ic"><i data-lucide="house-plus" width="20" height="20"></i></span>בית חדש<small>אתם תנהלו אותו</small></div>
              <div class="tile2"><span class="ic"><i data-lucide="key-round" width="20" height="20"></i></span>יש לי קוד<small>הצטרפות לבית קיים</small></div>
            </div>
            <div class="label">שם הבית</div>
            <div class="field">משפחת כהן</div>
            <div class="spacer"></div>
            <button class="cta">יצירת הבית<span class="arrow"><i data-lucide="arrow-left" width="20" height="20"></i></span></button>
          </div>
        </div>
        <figcaption>3. יצירה או הצטרפות</figcaption>
      </figure>
      <figure>
        <div class="phone">
          <div class="screen">
            <div style="margin-top: 46px">
            <div class="member-card"><span class="deco"></span>
              <div class="top"><span class="lbl">כרטיס הבית</span><span class="chip">מנהלת</span></div>
              <div class="grid2"><div><div class="lbl">השם שלי</div><div class="val">נועה</div></div><div><div class="lbl">הבית</div><div class="val">משפחת כהן</div></div></div>
            </div></div>
            <h1 style="margin-top: 28px">הבית מוכן</h1>
            <p class="lead">עכשיו אפשר להזמין את בני הבית ולהתחיל להוסיף פריטים.</p>
            <div class="spacer"></div>
            <button class="cta">להזמנת בני הבית<span class="arrow"><i data-lucide="arrow-left" width="20" height="20"></i></span></button>
            <div class="ghost">אחר כך, למסך הבית</div>
          </div>
        </div>
        <figcaption>4. הבית נוצר (הצלחה)</figcaption>
      </figure>
      <figure>
        <div class="phone">
          <div class="screen"><span class="back"><i data-lucide="chevron-right" width="21" height="21"></i></span>
            <div style="margin-top: 18px">
            <div class="member-card"><span class="deco"></span>
              <div class="top"><span class="lbl">כרטיס הבית</span><span class="chip off">שלב 2 מתוך 2</span></div>
              <div class="grid2"><div><div class="lbl">השם שלי</div><div class="val">אבי</div></div><div><div class="lbl">הבית</div><div class="val empty">___</div></div></div>
            </div></div>
            <h2 style="margin-top: 26px">קוד ההזמנה שקיבלתם</h2>
            <div class="label" style="margin-top: 12px">קוד (10 תווים)</div>
            <div class="field code err">K7PM4-QXD9B</div>
            <div class="error"><i data-lucide="circle-alert" width="16" height="16"></i>הקוד לא תקין או שפג תוקפו. נשארו 3 ניסיונות.</div>
            <div class="helper">אחרי 5 ניסיונות שגויים ההצטרפות ננעלת ל-15 דקות.</div>
            <div class="spacer"></div>
            <button class="cta">הצטרפות<span class="arrow"><i data-lucide="arrow-left" width="20" height="20"></i></span></button>
          </div>
        </div>
        <figcaption>5. הצטרפות עם קוד (שגיאה)</figcaption>
      </figure>
      <figure>
        <div class="phone">
          <div class="screen">
            <div class="hh-head"><div><div class="eyebrow">הבית שלי</div><h1>משפחת כהן</h1></div><span class="back"><i data-lucide="settings" width="21" height="21"></i></span></div>
            <div class="ticket">
              <div class="tt"><h2>הזמנה לבית</h2><p class="helper" style="margin-top: 4px">מוצג פעם אחת. לשימוש של בן בית אחד.</p></div>
              <div class="cut"></div>
              <div class="tb"><div class="c">K7PM4-QXD9R</div><div class="e">בתוקף עד מחר 14:32</div>
                <div style="display: flex; gap: 10px; margin-top: 14px"><button class="pill" style="background: var(--ink); color: var(--lime)"><i data-lucide="copy" width="18" height="18"></i>העתקה</button><button class="pill" style="background: var(--bg)"><i data-lucide="refresh-cw" width="18" height="18"></i>קוד חדש</button></div></div>
            </div>
            <h2 style="margin-top: 22px">בני הבית</h2>
            <div class="members">
              <div class="member"><span class="avatar">נ</span><span class="name">נועה</span><span class="role mgr">מנהלת</span></div>
              <div class="member"><span class="avatar">א</span><span class="name">אבי</span><span class="role">חבר</span></div>
            </div>
          </div>
          <div class="toast"><i data-lucide="check-circle-2" width="18" height="18"></i>הקוד הועתק</div>
          <nav class="nav">
            <a><i data-lucide="home" width="22" height="22"></i>בית</a>
            <a><i data-lucide="list-checks" width="22" height="22"></i>רשימה</a>
            <span class="add"><i data-lucide="plus" width="28" height="28"></i></span>
            <a><i data-lucide="star" width="22" height="22"></i>מועדפים</a>
            <a class="on"><i data-lucide="user-round" width="22" height="22"></i>הבית שלי</a>
          </nav>
        </div>
        <figcaption>6. הבית שלי + כרטיס הזמנה</figcaption>
      </figure>
    </div>
    <script>lucide.createIcons();</script>
  </body>
</html>
